name: CD Pipeline - Deploy Container to Google Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-cloud-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Production Artifacts
        run: |
          npm ci
          npm run build

      - name: Docker Build Check
        run: |
          docker build -t enterprise-platform:${{ github.sha }} .
          docker images
