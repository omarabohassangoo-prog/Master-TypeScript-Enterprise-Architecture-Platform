name: CI Pipeline - TypeScript Architecture Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify TypeScript & Code Consistency
        run: npm run lint

      - name: Execute Full Production Bundle Build
        run: npm run build

      - name: Verify Output Artifacts
        run: |
          ls -la dist/
          test -f dist/server.cjs || (echo "Missing dist/server.cjs" && exit 1)
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)
